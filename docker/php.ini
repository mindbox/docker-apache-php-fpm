; =============================================================================
; Loaded as zzz-custom.ini, so it wins over the base image's ini files.
;
; php.ini has no environment variable expansion, so runtime-tunable values
; (memory_limit, timezone, opcache invalidation, execution time) are written to
; zzz-runtime.ini by the entrypoint. That file sorts after this one and wins.
; Only settings that should not vary per deployment live here.
; =============================================================================

; =============================================================================
; Error handling
;
; E_STRICT was removed as a distinct level in PHP 8.0 and the constant itself is
; deprecated in 8.4 — referencing it here made PHP emit a deprecation notice at
; startup on every request. E_ALL & ~E_DEPRECATED is the equivalent today.
; =============================================================================
error_reporting = E_ALL & ~E_DEPRECATED
display_errors  = Off
display_startup_errors = Off
log_errors      = On
error_log       = /dev/stderr
html_errors     = Off

; Default 1024 truncates stack traces mid-frame, which hides the actual cause.
log_errors_max_len = 8192

; Skip assertion evaluation entirely (production behaviour).
zend.assertions = -1

; =============================================================================
; Security
; =============================================================================

; The old config left this at the default On, so every response carried
; "X-Powered-By: PHP/8.4.24" — a free version banner for scanners.
expose_php = Off

allow_url_fopen    = On
allow_url_include  = Off
file_uploads       = On

; =============================================================================
; Resources
; =============================================================================
post_max_size       = 128M
upload_max_filesize = 128M
max_input_vars      = 5000
; TYPO3's file list and WordPress's media uploader both post more than the
; default 20 files at once.
max_file_uploads    = 50
upload_tmp_dir      = /tmp

; 4 KB of output buffering lets PHP send headers after the first echo, which
; TYPO3 and WordPress both rely on. Compression is Apache's job, not PHP's.
output_buffering        = 4096
zlib.output_compression = Off

; =============================================================================
; Realpath cache
;
; A CMS resolves thousands of include paths per request. The default 4M/120s is
; too small for TYPO3's autoloader; this measurably reduces stat() syscalls.
; =============================================================================
realpath_cache_size = 4096K
realpath_cache_ttl  = 600

; =============================================================================
; OPcache
;
; opcache.validate_timestamps and revalidate_freq are set in zzz-runtime.ini
; from PHP_OPCACHE_VALIDATE_TIMESTAMPS, because the right value differs between
; development (bind-mounted code, must revalidate) and production (immutable
; image, never revalidate).
; =============================================================================
opcache.enable              = 1
opcache.enable_cli          = 0
opcache.memory_consumption  = 256

; TYPO3 and WordPress both have very large class maps; 16 MB of interned strings
; is exhausted by TYPO3 alone, after which every string is re-allocated per
; request.
opcache.interned_strings_buffer = 32

; Prime number, per the OPcache hashtable sizing recommendation. A full TYPO3
; instance with extensions sits around 12k-18k files.
opcache.max_accelerated_files = 30011

; MUST stay 1. TYPO3's Extbase and Doctrine read PHP doc comments at runtime;
; stripping them breaks annotation-driven mapping in ways that are very hard to
; debug.
opcache.save_comments = 1

; Compiled opcode cache on disk (path comes from PHP_OPCACHE_FILE_CACHE in
; zzz-runtime.ini). Survives container restarts and gives a much cheaper cold
; start, which matters when an orchestrator cycles pods.
opcache.file_cache_only               = 0
opcache.file_cache_consistency_checks = 1

; Recompile the whole cache rather than serving from a nearly-full one.
opcache.max_wasted_percentage = 10

; =============================================================================
; Sessions
;
; Files in /tmp means sessions are lost on restart and are NOT shared between
; containers — so a second replica logs everybody out. For anything scaled past
; one container set PHP_SESSION_HANDLER=redis and PHP_SESSION_PATH; see
; docs/DEPLOYMENT.md.
; =============================================================================
session.gc_probability  = 1
session.gc_divisor      = 1000
session.gc_maxlifetime  = 1440

; Reject session IDs the server never issued (session fixation).
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1
