; =============================================================================
; PHP-FPM pool configuration — replaces the base image's www.conf.
;
; This file holds only settings that do not depend on the runtime environment.
; PHP-FPM does NOT expand environment variables in numeric values, so every
; tunable (pm.*, timeouts, worker counts) is written to
; /usr/local/etc/php-fpm.d/zz-runtime.conf by the entrypoint instead. That file
; loads after this one; the two never set the same key.
; =============================================================================

[global]
error_log = /proc/self/fd/2

; Restart the pool if 10 children die within a minute — without this, a
; segfaulting extension can silently reduce the pool to zero workers.
emergency_restart_threshold = 10
emergency_restart_interval  = 1m
process_control_timeout     = 10s

; Default is 1024 characters, which truncates PHP stack traces mid-frame.
log_limit = 8192

[www]
user  = www-data
group = www-data

; Unix socket rather than TCP: no TCP/IP stack overhead, and the socket cannot
; be reached from outside the container at all.
listen       = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode  = 0660

; Apache has more worker threads than FPM has children by design, so bursts
; queue here instead of being refused. Keep this at or above
; APACHE_MAX_REQUEST_WORKERS or excess connections get ECONNREFUSED.
listen.backlog = 1024

; =============================================================================
; Logging
;
; Only stderr/stdout — no files inside the container. The pool access log is off
; by default because Apache already logs every request, and enabling both
; produced two lines per request in `docker logs`. Set PHP_FPM_ACCESS_LOG=on to
; get FPM-side timings (useful when you suspect Apache is not the bottleneck).
; =============================================================================
catch_workers_output = yes

; Strips the "NOTICE: PID xx" prefix FPM otherwise wraps around every line of
; application output, which breaks JSON log parsing downstream.
decorate_workers_output = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on

; =============================================================================
; Slow request diagnostics
;
; Any request slower than PHP_FPM_SLOWLOG_TIMEOUT gets a full PHP backtrace
; written to stderr. This is the single most useful tool for finding what is
; slow in a TYPO3 or WordPress install under real traffic, and it costs nothing
; while requests stay fast.
; =============================================================================
slowlog = /proc/self/fd/2

; =============================================================================
; Environment and security
; =============================================================================

; Pass the container's environment through to PHP, so database credentials and
; the like injected via `docker run -e` / compose are visible to the app.
clear_env = no

; Refuse to execute anything that is not a .php file even if Apache proxies it.
; This is the actual defence against "/uploads/avatar.jpg/x.php" style attacks —
; the Apache FilesMatch block only decides what gets proxied here.
security.limit_extensions = .php
